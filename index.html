<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小机器人去充电 · 编程启蒙游戏</title>
<style>
  :root {
    --bg: #f4f7ff;
    --panel: #ffffff;
    --primary: #5b8def;
    --primary-dark: #3f6fd1;
    --green: #4cc38a;
    --green-dark: #34a06f;
    --orange: #ff9f43;
    --pink: #ff6b9d;
    --ink: #2c3e66;
    --grid-line: #dfe6f5;
    --cell: #eef3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    user-select: none;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h1 {
    font-size: 26px;
    margin: 6px 0 2px;
    text-align: center;
  }
  .game-wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* 竖屏：.main 和 .panel 不产生盒子，子元素照常单列排列（和原来一样） */
  .main, .panel { display: contents; }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border-radius: 16px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(91,141,239,.12);
    font-size: 17px;
    font-weight: bold;
  }
  .status-bar > span:first-child { white-space: nowrap; }
  .status-bar .level-name { color: var(--primary); }
  .status-bar .hint {
    font-weight: normal; font-size: 13px; color: #7a89ad;
    flex: 1; text-align: center; padding: 0 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 状态栏里的"选关"小按钮 */
  .level-toggle {
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 7px 12px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .level-toggle:active { translate: 0 3px; box-shadow: 0 0 0 var(--primary-dark); }

  /* 选关浮层里的网格 */
  .level-card { max-width: 340px; }
  .level-card h2 { margin: 2px 0 16px; font-size: 20px; color: var(--ink); }
  .level-select {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
  }
  .level-close {
    margin-top: 18px;
    border: none;
    background: #9aa6c4;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    padding: 11px 26px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 0 #7e8aa8;
  }
  .level-close:active { translate: 0 4px; box-shadow: 0 0 0 #7e8aa8; }
  .level-select .level-btn {
    width: 100%;          /* 填满网格列，永远不溢出卡片 */
    aspect-ratio: 1 / 1;  /* 保持正方形 */
    padding: 0;
    border: none;
    border-radius: 12px;
    background: #eef3ff;
    color: var(--primary);
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #d3def5;
    transition: translate .08s;
  }
  .level-select .level-btn:active { translate: 0 3px; box-shadow: 0 0 0 #d3def5; }
  .level-select .level-btn.current {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .level-btn.done::after {
    content: "⭐";
    font-size: 11px;
    position: absolute;
    margin: -8px 0 0 2px;
  }
  .level-btn { position: relative; }

  /* 地图 */
  #board {
    background: var(--panel);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 4px 18px rgba(91,141,239,.15);
    display: grid;
    gap: 4px;
    aspect-ratio: 1 / 1;
    width: 100%;
    position: relative; /* 机器人以地图为定位参照 */
  }
  .cell {
    background: var(--cell);
    border-radius: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  .cell.wall {
    background: #c9d3ea;
    box-shadow: inset 0 -4px 0 #aab8d8;
  }
  .cell.goal { background: #fff4d6; }
  .cell.star { background: #fff9e6; }
  .star-burst {
    position: absolute;
    z-index: 7;
    font-size: 26px;
    pointer-events: none;
    animation: starfly .6s ease-out forwards;
  }
  @keyframes starfly {
    0%   { transform: scale(.6) translateY(0); opacity: 1; }
    100% { transform: scale(1.6) translateY(-30px); opacity: 0; }
  }
  .robot {
    position: absolute;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    transition: left .35s ease, top .35s ease, transform .35s ease;
    z-index: 5;
    will-change: left, top, transform;
  }
  .robot.bump { animation: bump .4s; }
  @keyframes bump {
    0%,100% { scale: 1; }
    30% { scale: 1.25; }
    60% { scale: .9; }
  }
  .robot.cheer { animation: cheer .6s infinite; }
  @keyframes cheer {
    0%,100% { translate: 0 0; }
    50% { translate: 0 -8px; }
  }
  /* 被撞的石头晃一晃 */
  .cell.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-4px) rotate(-6deg); }
    40% { transform: translateX(4px) rotate(6deg); }
    60% { transform: translateX(-3px) rotate(-4deg); }
    80% { transform: translateX(3px) rotate(4deg); }
  }
  /* 撞击冒出的 💥 */
  .crash-burst {
    position: absolute;
    z-index: 8;
    font-size: 30px;
    pointer-events: none;
    animation: burst .6s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: scale(.3); opacity: 0; }
    30%  { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* 程序条：固定单行，命令多了左右滑动查看 */
  .program {
    background: var(--panel);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 4px 14px rgba(91,141,239,.12);
    min-height: 58px;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .program::-webkit-scrollbar { height: 5px; }
  .program::-webkit-scrollbar-thumb { background: #cfd9f0; border-radius: 3px; }
  .program .chip { flex: 0 0 auto; }
  .chip {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
    animation: pop .2s;
  }
  @keyframes pop { from { scale: .4; } to { scale: 1; } }
  .chip.cmd-up, .chip.cmd-down, .chip.cmd-left, .chip.cmd-right { background: var(--green); }
  .chip.running { outline: 4px solid #ffd86b; }
  /* 循环"圈"：紫色外框，里面装着被重复的动作 */
  .loop-chip {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 14px;
    background: #efe6ff;
    border: 2px dashed #b98bff;
    animation: pop .2s;
  }
  .loop-chip.open { border-style: solid; box-shadow: 0 0 0 3px rgba(185,139,255,.3); }
  .loop-chip .loop-head {
    display: flex;
    align-items: center;
    gap: 2px;
    background: #b98bff;
    color: #fff;
    border-radius: 10px;
    padding: 2px 4px;
    height: 42px;
  }
  .loop-chip .loop-body {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .loop-chip .loop-ph { color: #a98fd6; font-size: 13px; padding: 0 6px; white-space: nowrap; }
  .loop-chip .loop-count { font-size: 18px; font-weight: bold; min-width: 16px; text-align: center; }
  .loop-chip .loop-x { font-size: 14px; opacity: .85; }
  .loop-chip .loop-btn {
    width: 22px; height: 22px;
    border: none;
    border-radius: 7px;
    background: rgba(255,255,255,.3);
    color: #fff;
    font-size: 17px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .loop-chip .loop-btn:active { background: rgba(255,255,255,.55); }

  /* 按钮区 */
  .controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
  }
  button.cmd {
    border: none;
    border-radius: 16px;
    padding: 16px 0;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: translate .08s;
    background: var(--green);
  }
  button.cmd:active { translate: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  button.cmd .ico { font-size: 28px; }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.3fr;
    gap: 8px;
  }
  button.act {
    border: none;
    border-radius: 16px;
    padding: 14px 0;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    transition: translate .08s;
    color: #fff;
  }
  button.act:active { translate: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .btn-loop { background: #b98bff; }
  .btn-undo { background: #9aa6c4; }
  .btn-clear { background: var(--pink); }
  .btn-run { background: var(--primary); }
  button.act { font-size: 15px; padding: 14px 0; }
  button:disabled { opacity: .5; cursor: default; }

  /* 庆祝弹窗 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(44,62,102,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 28px 26px;
    text-align: center;
    max-width: 320px;
    width: 86%;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    animation: pop .3s;
  }
  .card .emoji { font-size: 56px; }
  .card h2 { margin: 8px 0; font-size: 24px; color: var(--green-dark); }
  .card p { color: #7a89ad; font-size: 15px; margin: 6px 0 18px; }
  .card button {
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 30px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--primary-dark);
  }
  .card button:active { translate: 0 4px; box-shadow: 0 1px 0 var(--primary-dark); }
  /* 过关撒花 */
  .confetti-piece {
    position: fixed;
    top: -24px;
    z-index: 60;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg); opacity: 1; }
  }
  /* 自由搭建模式 */
  .editor { display: none; flex-direction: column; gap: 10px; }
  body.editing .editor { display: flex; }
  body.editing .controls,
  body.editing .actions,
  body.editing .program,
  body.editing .level-toggle { display: none; }
  .edit-hint { text-align: center; color: #7a89ad; font-size: 14px; }
  .palette {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }
  .palette .brush {
    border: none;
    background: #fff;
    border-radius: 14px;
    padding: 8px 0;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: 0 3px 0 #d3def5;
  }
  .palette .brush span { font-size: 12px; color: var(--ink); }
  .palette .brush.current {
    background: var(--primary);
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .palette .brush.current span { color: #fff; }
  .edit-actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1.2fr;
    gap: 8px;
  }
  .btn-edit-size { background: #f0a500; }
  .btn-edit-clear { background: var(--pink); }
  .btn-edit-back { background: #9aa6c4; }
  .btn-edit-play { background: var(--primary); }
  /* 编辑时格子可点，给点提示态 */
  body.editing .cell { cursor: pointer; }
  .cell.startmark { background: #e3fff2; opacity: .85; }
  .level-build {
    margin-top: 16px;
    border: none;
    background: var(--green);
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    padding: 12px 22px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--green-dark);
    display: block;
    width: 100%;
  }
  .level-build:active { translate: 0 4px; box-shadow: 0 0 0 var(--green-dark); }

  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    translate: -50% 0;
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 16px;
    z-index: 60;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: .95; }

  /* ===== 横屏：左右两栏，地图按高度放大，右侧放命令与按钮 ===== */
  @media (orientation: landscape) {
    body { justify-content: flex-start; }
    .game-wrap { max-width: 100%; }
    /* 让 .main 变成真正的两栏盒子 */
    .main {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }
    .panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 460px;
      justify-content: center;
    }
    /* 地图占左侧，按可用高度决定大小（正方形），留出标题和状态栏的空间 */
    #board {
      flex: 0 0 auto;
      width: auto;
      height: calc(100vh - 96px);
      max-height: calc(100vh - 96px);
      aspect-ratio: 1 / 1;
    }
  }
  /* 矮屏（手机横屏）：标题更小、按钮更紧凑，进一步省高度 */
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding: 8px; }
    h1 { font-size: 18px; margin: 2px 0; }
    .main { gap: 12px; }
    #board { height: calc(100vh - 70px); max-height: calc(100vh - 70px); padding: 8px; }
    .program { min-height: 48px; }
    button.cmd { padding: 10px 0; font-size: 14px; }
    button.cmd .ico { font-size: 22px; }
    button.act { padding: 11px 0; font-size: 14px; }
  }
</style>
</head>
<body>
  <h1>🤖 小机器人去充电</h1>

  <div class="game-wrap">
    <div class="status-bar">
      <span id="levelLabel">第 <span class="level-name" id="levelNum">1</span> 关</span>
      <span class="hint" id="goalHint">帮机器人找到电池！</span>
      <button class="level-toggle" id="levelToggle">🗺 选关</button>
    </div>

    <div class="main">
      <div id="board"></div>

      <div class="panel">
        <div class="program" id="program"></div>

        <div class="controls">
          <button class="cmd btn-up"    id="btnUp"><span class="ico">⬆</span>上</button>
          <button class="cmd btn-down"  id="btnDown"><span class="ico">⬇</span>下</button>
          <button class="cmd btn-left"  id="btnLeft"><span class="ico">⬅</span>左</button>
          <button class="cmd btn-right" id="btnRight"><span class="ico">➡</span>右</button>
        </div>

        <div class="actions">
          <button class="act btn-loop"  id="btnLoop">🔁 重复</button>
          <button class="act btn-undo"  id="btnUndo">↩ 撤回</button>
          <button class="act btn-clear" id="btnClear">🗑 清空</button>
          <button class="act btn-run"   id="btnRun">▶ 出发！</button>
        </div>

        <!-- 自由搭建：调色板 + 按钮（平时隐藏） -->
        <div class="editor" id="editor">
          <div class="edit-hint">先点一个工具，再点格子来画 👇</div>
          <div class="palette" id="palette">
            <button class="brush current" data-brush="wall">🪨<span>障碍</span></button>
            <button class="brush" data-brush="star">⭐<span>宝贝</span></button>
            <button class="brush" data-brush="start">🤖<span>起点</span></button>
            <button class="brush" data-brush="goal">🔋<span>电池</span></button>
            <button class="brush" data-brush="erase">🧹<span>擦掉</span></button>
          </div>
          <div class="edit-actions">
            <button class="act btn-edit-size"  id="btnEditSize">📐 换大小</button>
            <button class="act btn-edit-clear" id="btnEditClear">🗑 清空</button>
            <button class="act btn-edit-back"  id="btnEditBack">← 返回</button>
            <button class="act btn-edit-play"  id="btnEditPlay">▶ 开始玩</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 选关浮层 -->
  <div class="overlay" id="levelOverlay">
    <div class="card level-card">
      <h2>选择关卡</h2>
      <div class="level-select" id="levelSelect"></div>
      <button class="level-build" id="levelBuild">🏗 自己造一关</button>
      <button class="level-close" id="levelClose">关闭</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="cardEmoji">🎉</div>
      <h2 id="cardTitle">太棒啦！</h2>
      <p id="cardText">机器人充上电了！</p>
      <button id="cardBtn">下一关 →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== 关卡数据 =====
   每一关是一张方格地图。
   start 起点 / goal 电池终点 / walls 障碍(走不进) / stars 路上要收集的宝贝(可选)
   有 stars 的关卡，必须把所有宝贝都捡完、再走到🔋才算过关。
   障碍和宝贝的"皮肤"由 WALL_EMOJIS / REWARD_EMOJIS 随位置变化，更丰富。
*/
const LEVELS = [
  // —— 第一组：认识走路（无障碍）——
  { // 1 往右直直走
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:3,y:3}, walls: [],
    hint: "一直往右走，找到电池！"
  },
  { // 2 往上走
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:0,y:0}, walls: [],
    hint: "一直往上走就到啦！"
  },
  { // 3 拐一个弯
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:3,y:0}, walls: [],
    hint: "先往右，再往上走！"
  },
  { // 4 路上捡一颗星星
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4}, walls: [],
    stars: [ {x:2,y:4} ],
    hint: "路上有个宝贝，记得捡走它！"
  },

  // —— 第二组：开始有石头 ——
  { // 5 绕开一块石头
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4}, walls: [ {x:2,y:4} ],
    hint: "当心障碍，要绕过去！"
  },
  { // 6 走 L 形
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:0},
    walls: [ {x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3} ],
    hint: "先一直往上，再往右走！"
  },
  { // 7 边走边捡两颗星
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:0}, walls: [],
    stars: [ {x:2,y:4},{x:2,y:0} ],
    hint: "把两个宝贝都捡到，再去充电！"
  },
  { // 8 门洞：中间留一个口
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4},
    walls: [ {x:2,y:4},{x:2,y:3},{x:2,y:1},{x:2,y:0} ],
    hint: "墙上有个洞，从中间钻过去！"
  },

  // —— 第三组：S 形与小迷宫 ——
  { // 9 S 形迷宫
    cols: 6, rows: 6, start: {x:0,y:5}, goal: {x:5,y:0},
    walls: [

// 四个方向各走一格
const MOVE_DELTA = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 }
};
const ARROW = { up: '⬆', down: '⬇', left: '⬅', right: '➡' };

// 障碍物和奖励的"皮肤"——同一格固定、不同格丰富变化，让画面更有趣
const WALL_EMOJIS   = ['🪨','💩','🌵','🔥','🧱','🌳','🚧','🦔'];
const REWARD_EMOJIS = ['⭐','💎','🍎','🍓','🎁','🍪','🍰','🍭','🍌','🏆'];
// 用坐标算一个稳定的"随机"序号，保证同一关同一格图案不变
function pickEmoji(list, x, y) {
  const seed = (levelIndex + 7) * 131 + x * 17 + y * 31;
  return list[seed % list.length];
}

let levelIndex = 0;       // -1 表示正在玩"自己造的关"
// 命令序列。每一项是方向 'up'/'down'/'left'/'right'，
// 或一个循环标记 { loop: N } —— 表示"它后面的动作重复 N 次"
let program = [];
let robot = null;        // {x, y, dir}
let isRunning = false;
let cleared = new Set(); // 已通关的关卡序号（用来显示 ⭐）
let starsLeft = new Set(); // 本关还没捡到的星星
let customLevel = null;  // 自己造的关卡数据
let editing = false;     // 是否在搭建模式
let editBrush = 'wall';  // 当前画笔

const boardEl   = document.getElementById('board');
const programEl = document.getElementById('program');
const overlayEl = document.getElementById('overlay');
const toastEl   = document.getElementById('toast');

function level() { return levelIndex === -1 ? customLevel : LEVELS[levelIndex]; }

/* 渲染地图与机器人初始位置 */
function buildBoard() {
  const lv = level();
  boardEl.style.gridTemplateColumns = `repeat(${lv.cols}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${lv.rows}, 1fr)`;
  boardEl.innerHTML = '';

  for (let y = 0; y < lv.rows; y++) {
    for (let x = 0; x < lv.cols; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      if (lv.walls.some(w => w.x === x && w.y === y)) {
        cell.classList.add('wall');
        cell.textContent = pickEmoji(WALL_EMOJIS, x, y);
      }
      if (lv.goal && lv.goal.x === x && lv.goal.y === y) {
        cell.classList.add('goal');
        cell.textContent = '🔋';
      }
      if ((lv.stars || []).some(s => s.x === x && s.y === y)) {
        cell.classList.add('star');
        cell.dataset.star = '1';
        cell.textContent = pickEmoji(REWARD_EMOJIS, x, y);
      }
      // 编辑模式下，起点格显示一个淡淡的🤖标记
      if (editing && lv.start && lv.start.x === x && lv.start.y === y && !(lv.goal && lv.goal.x===x && lv.goal.y===y)) {
        cell.classList.add('startmark');
        cell.textContent = '🤖';
      }
      boardEl.appendChild(cell);
    }
  }

  // 这一关还没捡到的星星（坐标字符串集合）
  starsLeft = new Set((lv.stars || []).map(s => s.x + ',' + s.y));

  // 机器人（编辑模式下若还没放起点，就先不显示机器人）
  if (lv.start) {
    robot = { x: lv.start.x, y: lv.start.y };
    const r = document.createElement('div');
    r.className = 'robot';
    r.id = 'robot';
    r.textContent = '🤖';
    boardEl.appendChild(r);
    placeRobot(false);
  } else {
    robot = null;
  }

  // 状态栏文字
  const label = document.getElementById('levelLabel');
  if (levelIndex === -1) {
    label.textContent = editing ? '🏗 搭建中' : '🏗 自由关';
  } else {
    label.innerHTML = '第 <span class="level-name">' + (levelIndex + 1) + '</span> 关';
  }
  document.getElementById('goalHint').textContent = lv.hint || '';
  renderLevelSelect();
}

/* 选关：一排可点的关卡按钮，全部可选，当前关高亮，通关的带 ⭐ */
function renderLevelSelect() {
  const box = document.getElementById('levelSelect');
  box.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    if (i === levelIndex) btn.classList.add('current');
    if (cleared.has(i)) btn.classList.add('done');
    btn.textContent = (i + 1);
    btn.onclick = () => goToLevel(i);
    box.appendChild(btn);
  }
}

/* 跳到指定关卡 */
function goToLevel(i) {
  if (isRunning) return;          // 运行中不许切关
  closeLevelPicker();
  if (i === levelIndex) return;   // 已经在这关
  levelIndex = i;
  program = [];
  renderProgram();
  buildBoard();
}

/* 打开 / 关闭选关浮层 */
function openLevelPicker() {
  if (isRunning) return;
  renderLevelSelect();
  document.getElementById('levelOverlay').classList.add('show');
}
function closeLevelPicker() {
  document.getElementById('levelOverlay').classList.remove('show');
}

/* ===== 自由搭建模式 ===== */
function startEditor() {
  if (isRunning) return;
  closeLevelPicker();
  editing = true;
  levelIndex = -1;
  document.body.classList.add('editing');
  // 新建一张空白 6x6 地图，先放好起点和电池
  customLevel = {
    cols: 6, rows: 6,
    start: { x: 0, y: 5 },
    goal:  { x: 5, y: 0 },
    walls: [],
    stars: [],
    hint: ''
  };
  program = [];
  renderProgram();
  buildBoard();
}

/* 在编辑模式点格子：根据当前画笔修改地图 */
function editCellAt(x, y) {
  const lv = customLevel;
  const isStart = lv.start && lv.start.x === x && lv.start.y === y;
  const isGoal  = lv.goal  && lv.goal.x === x && lv.goal.y === y;
  const wallIdx = lv.walls.findIndex(w => w.x === x && w.y === y);
  const starIdx = lv.stars.findIndex(s => s.x === x && s.y === y);

  const removeAll = () => {
    if (wallIdx >= 0) lv.walls.splice(wallIdx, 1);
    if (starIdx >= 0) lv.stars.splice(starIdx, 1);
  };

  switch (editBrush) {
    case 'wall':
      if (isStart || isGoal) { toast('这里是起点或电池哦'); return; }
      if (wallIdx >= 0) { lv.walls.splice(wallIdx, 1); }   // 再点一次擦掉
      else { if (starIdx >= 0) lv.stars.splice(starIdx, 1); lv.walls.push({ x, y }); }
      break;
    case 'star':
      if (isStart || isGoal) { toast('这里是起点或电池哦'); return; }
      if (starIdx >= 0) { lv.stars.splice(starIdx, 1); }
      else { if (wallIdx >= 0) lv.walls.splice(wallIdx, 1); lv.stars.push({ x, y }); }
      break;
    case 'start':
      if (isGoal) { toast('这里已经是电池啦'); return; }
      removeAll();
      lv.start = { x, y };
      break;
    case 'goal':
      if (isStart) { toast('这里已经是起点啦'); return; }
      removeAll();
      lv.goal = { x, y };
      break;
    case 'erase':
      if (isStart || isGoal) { toast('起点和电池不能擦掉，换个位置放就行'); return; }
      removeAll();
      break;
  }
  tone(700, 0.05, 0, 'square', 0.1);
  buildBoard();
}

/* 选画笔 */
function selectBrush(b) {
  editBrush = b;
  document.querySelectorAll('.palette .brush').forEach(el => {
    el.classList.toggle('current', el.dataset.brush === b);
  });
}

/* 换地图大小（在 5/6/7/8 之间循环） */
function cycleEditSize() {
  const sizes = [5, 6, 7, 8];
  const cur = customLevel.cols;
  const next = sizes[(sizes.indexOf(cur) + 1) % sizes.length];
  customLevel.cols = next;
  customLevel.rows = next;
  // 把超出新边界的东西清掉
  const inb = (p) => p.x < next && p.y < next;
  customLevel.walls = customLevel.walls.filter(inb);
  customLevel.stars = customLevel.stars.filter(inb);
  if (!inb(customLevel.start)) customLevel.start = { x: 0, y: next - 1 };
  if (!inb(customLevel.goal))  customLevel.goal  = { x: next - 1, y: 0 };
  toast('地图变成 ' + next + '×' + next);
  buildBoard();
}

/* 清空当前搭建（保留起点电池） */
function clearEditor() {
  customLevel.walls = [];
  customLevel.stars = [];
  buildBoard();
}

/* 校验自己造的关能不能走通（BFS） */
function validateCustom() {
  const lv = customLevel;
  if (!lv.start || !lv.goal) return '要有一个起点🤖和一个电池🔋哦';
  const wall = new Set(lv.walls.map(w => w.x + ',' + w.y));
  const free = (x, y) => x >= 0 && y >= 0 && x < lv.cols && y < lv.rows && !wall.has(x + ',' + y);
  const seen = new Set([lv.start.x + ',' + lv.start.y]);
  const q = [[lv.start.x, lv.start.y]];
  while (q.length) {
    const [x, y] = q.shift();
    [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dx,dy]) => {
      const nx = x+dx, ny = y+dy, k = nx+','+ny;
      if (free(nx, ny) && !seen.has(k)) { seen.add(k); q.push([nx, ny]); }
    });
  }
  if (!seen.has(lv.goal.x + ',' + lv.goal.y)) return '机器人走不到电池，挪挪石头试试～';
  for (const s of lv.stars) {
    if (!seen.has(s.x + ',' + s.y)) return '有个宝贝被障碍围住了，机器人拿不到哦';
  }
  return null; // 没问题
}

/* 从搭建切换到试玩 */
function playCustom() {
  const err = validateCustom();
  if (err) { toast(err); return; }
  editing = false;
  document.body.classList.remove('editing');
  customLevel.hint = '你自己造的关，加油！';
  program = [];
  renderProgram();
  buildBoard();
}

/* 退出搭建，回到第1关 */
function exitEditor() {
  editing = false;
  document.body.classList.remove('editing');
  levelIndex = 0;
  program = [];
  renderProgram();
  buildBoard();
}

/* 机器人当前格子若有星星，就把它收集掉 */
function collectStarHere() {
  const key = robot.x + ',' + robot.y;
  if (!starsLeft.has(key)) return;
  starsLeft.delete(key);
  const cell = boardEl.querySelector(`.cell[data-star][data-x="${robot.x}"][data-y="${robot.y}"]`);
  let emoji = '⭐';
  if (cell) {
    emoji = cell.textContent || '⭐';
    cell.classList.remove('star');
    cell.removeAttribute('data-star');
    cell.textContent = '';
  }
  // 飞出刚捡到的那个奖励的小动画 + 叮的一声
  starBurst(robot.x, robot.y, emoji);
  tone(1318, 0.12, 0, 'triangle', 0.2);
  tone(1760, 0.12, 0.06, 'triangle', 0.18);
}

/* 收集奖励时冒出的小动画 */
function starBurst(x, y, emoji) {
  const cell = boardEl.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
  if (!cell) return;
  const s = document.createElement('div');
  s.className = 'star-burst';
  s.textContent = emoji || '⭐';
  s.style.left = (cell.offsetLeft + cell.offsetWidth / 2 - 14) + 'px';
  s.style.top  = (cell.offsetTop + cell.offsetHeight / 2 - 14) + 'px';
  boardEl.appendChild(s);
  setTimeout(() => s.remove(), 600);
}

/* 把机器人div对齐到目标格子的真实位置（自动算准间距和留白） */
function placeRobot(animate) {
  const r = document.getElementById('robot');
  const cell = boardEl.querySelector(`.cell[data-x="${robot.x}"][data-y="${robot.y}"]`);
  if (!cell) return;
  if (!animate) r.style.transition = 'none';
  // offsetLeft/Top 是相对于 #board（已设为 position:relative）的精确像素位置
  r.style.left   = cell.offsetLeft + 'px';
  r.style.top    = cell.offsetTop + 'px';
  r.style.width  = cell.offsetWidth + 'px';
  r.style.height = cell.offsetHeight + 'px';
  if (!animate) {
    // 强制重绘后恢复动画
    void r.offsetWidth;
    r.style.transition = '';
  }
}

/* 当前打开着的循环（它的 body 在收集后续动作）；null 表示没开循环 */
let openLoop = null;

/* 一个方向命令做成箭头方块 */
function makeChip(cmd, key) {
  const chip = document.createElement('div');
  chip.className = 'chip cmd-' + cmd;
  chip.dataset.key = key;
  chip.textContent = ARROW[cmd];
  return chip;
}

/* 渲染程序条。循环是一个紫色"圈"，里面装着被重复的动作 */
function renderProgram() {
  programEl.innerHTML = '';
  if (program.length === 0) return;
  program.forEach((item, i) => {
    if (typeof item === 'object' && item.loop !== undefined) {
      // 循环"圈"
      const box = document.createElement('div');
      box.className = 'loop-chip' + (item.open ? ' open' : '');
      box.dataset.index = i;
      // 次数调节
      const head = document.createElement('div');
      head.className = 'loop-head';
      head.innerHTML =
        `<button class="loop-btn" data-act="dec" data-i="${i}">−</button>` +
        `<span class="loop-x">×</span>` +
        `<span class="loop-count">${item.loop}</span>` +
        `<button class="loop-btn" data-act="inc" data-i="${i}">＋</button>`;
      box.appendChild(head);
      // 圈里的动作
      const body = document.createElement('div');
      body.className = 'loop-body';
      item.body.forEach((c, j) => body.appendChild(makeChip(c, i + '-' + j)));
      if (item.open && item.body.length === 0) {
        const ph = document.createElement('span');
        ph.className = 'loop-ph';
        ph.textContent = '把动作放进来…';
        body.appendChild(ph);
      }
      box.appendChild(body);
      programEl.appendChild(box);
    } else {
      programEl.appendChild(makeChip(item, '' + i));
    }
  });
  programEl.scrollLeft = programEl.scrollWidth;
}

/* 命令总数（含循环里的），防止排太多 */
function totalCount() {
  let n = 0;
  for (const it of program) n += (typeof it === 'object' && it.loop !== undefined) ? it.body.length + 1 : 1;
  return n;
}

/* 点 🔁：没开循环就开一个圈，已开就收口 */
function addLoop() {
  if (isRunning) return;
  if (openLoop) {
    // 收口；如果圈里是空的，就把这个空圈删掉
    if (openLoop.body.length === 0) program = program.filter(it => it !== openLoop);
    openLoop.open = false;
    openLoop = null;
    tone(560, 0.08, 0, 'square', 0.12);
  } else {
    if (totalCount() >= 60) { toast('命令有点太多啦～'); return; }
    openLoop = { loop: 2, body: [], open: true };
    program.push(openLoop);
    tone(740, 0.07, 0, 'square', 0.12);
  }
  updateLoopBtn();
  renderProgram();
}

/* 循环按钮文字随状态变化 */
function updateLoopBtn() {
  const b = document.getElementById('btnLoop');
  if (b) b.textContent = openLoop ? '✓ 结束圈' : '🔁 重复';
}

/* 调整循环次数（2~9） */
function changeLoop(i, delta) {
  if (isRunning) return;
  const item = program[i];
  if (!item || item.loop === undefined) return;
  item.loop = Math.max(2, Math.min(9, item.loop + delta));
  renderProgram();
  tone(880, 0.05, 0, 'square', 0.1);
}

/* 加方向命令：圈开着就放进圈里，否则放到外面 */
function addCommand(cmd) {
  if (isRunning) return;
  if (totalCount() >= 60) { toast('命令有点太多啦～'); return; }
  if (openLoop) openLoop.body.push(cmd);
  else program.push(cmd);
  renderProgram();
}

/* 撤回：优先从打开的圈里撤，圈空了再撤外面 */
function undo() {
  if (isRunning) return;
  if (openLoop && openLoop.body.length > 0) {
    openLoop.body.pop();
  } else if (openLoop) {
    // 空圈，撤回就把圈也去掉
    program = program.filter(it => it !== openLoop);
    openLoop = null;
    updateLoopBtn();
  } else {
    program.pop();
  }
  renderProgram();
}

function clearProgram() {
  if (isRunning) return;
  program = [];
  openLoop = null;
  updateLoopBtn();
  renderProgram();
  buildBoard(); // 机器人回到起点
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll('button').forEach(b => {
    if (b.id !== 'cardBtn') b.disabled = disabled;
  });
}

/* 把带循环的命令展开成一串实际要走的步骤。
   循环"圈"会把它 body 里的动作整组重复 N 次。
   返回数组，每项 { dir, key }，key 指向要高亮的命令方块。 */
function flattenProgram() {
  const steps = [];
  program.forEach((item, i) => {
    if (typeof item === 'object' && item.loop !== undefined) {
      for (let r = 0; r < item.loop; r++) {
        item.body.forEach((c, j) => steps.push({ dir: c, key: i + '-' + j }));
      }
    } else {
      steps.push({ dir: item, key: '' + i });
    }
  });
  return steps;
}

function clearRunHighlight() {
  programEl.querySelectorAll('.running').forEach(c => c.classList.remove('running'));
}

/* 运行程序：一步步执行 */
async function run() {
  if (isRunning) return;
  // 出发前自动收口还开着的循环圈
  if (openLoop) {
    if (openLoop.body.length === 0) program = program.filter(it => it !== openLoop);
    openLoop.open = false;
    openLoop = null;
    updateLoopBtn();
    renderProgram();
  }
  const steps = flattenProgram();
  if (steps.length === 0) {
    toast('先给机器人下几个走路命令吧～');
    return;
  }
  isRunning = true;
  setButtonsDisabled(true);
  // 重建地图：机器人回起点、星星重新出现
  buildBoard();
  const lv = level();
  await sleep(300);

  for (let s = 0; s < steps.length; s++) {
    clearRunHighlight();
    const active = programEl.querySelector(`[data-key="${steps[s].key}"]`);
    if (active) {
      active.classList.add('running');
      // 只在命令条内部横向滚动，让当前命令居中可见（不动整个页面）
      const box = active.closest('.loop-chip') || active;
      programEl.scrollLeft = box.offsetLeft - programEl.clientWidth / 2 + box.offsetWidth / 2;
    }
    const cmd = steps[s].dir;

    const d = MOVE_DELTA[cmd];
    const nx = robot.x + d.x;
    const ny = robot.y + d.y;
    if (!canMoveTo(nx, ny)) {
      // 撞墙或出界：朝障碍方向冲一下、撞击、再弹回
      soundBump();
      await crash(d, nx, ny);
      const hitRock = level().walls.some(w => w.x === nx && w.y === ny);
      finishRun(false,
        hitRock ? '咣！撞到障碍啦！' : '哎呀，撞墙啦！',
        hitRock ? '前面有障碍挡路，机器人过不去，要绕开它哦～' : '机器人不能走出地图，再想想怎么走～',
        '😵', '再试一次');
      return;
    }
    robot.x = nx;
    robot.y = ny;
    placeRobot(true);
    soundStep();
    await sleep(450);

    // 踩到星星就收集
    collectStarHere();

    // 到达终点：必须把星星都捡完才算过关
    if (robot.x === lv.goal.x && robot.y === lv.goal.y) {
      if (starsLeft.size > 0) {
        clearRunHighlight();
        await sleep(200);
        finishRun(false, '还差宝贝！',
          `还有 ${starsLeft.size} 个宝贝没捡到呢，先把它们都收集齐再来充电～`,
          '🤔', '再试一次');
        return;
      }
      clearRunHighlight();
      cheer();
      if (levelIndex === -1) {
        // 自己造的关：通关
        soundWin();
        await sleep(700);
        finishRun(true, '通关啦！🎉', '你自己造的关也能通关，真厉害！', '🎉', '再玩一次');
        return;
      }
      cleared.add(levelIndex);  // 记下这一关已通关，显示 ⭐
      const isLast = levelIndex === LEVELS.length - 1;
      if (isLast) soundCheer(); else soundWin();
      await sleep(700);
      finishRun(true,
        isLast ? '全部通关啦！🏆' : '太棒啦！',
        isLast ? '你是真正的小小程序员！可以从头再玩，或挑战实体机器人～' : '机器人充上电了！',
        isLast ? '🏆' : '🎉',
        isLast ? '再玩一次' : '下一关 →',
        isLast);
      return;
    }
  }

  // 程序走完但没到终点
  clearRunHighlight();
  await sleep(200);
  finishRun(false, '差一点点！', '机器人还没走到电池那里，再加几个命令试试～', '🤔', '再试一次');
}

function canMoveTo(x, y) {
  const lv = level();
  if (x < 0 || y < 0 || x >= lv.cols || y >= lv.rows) return false;
  if (lv.walls.some(w => w.x === x && w.y === y)) return false;
  return true;
}

function finishRun(success, title, text, emoji, btnLabel, isFinalWin) {
  isRunning = false;
  setButtonsDisabled(false);
  if (success) confetti(isFinalWin ? 160 : 90); // 过关撒花，通关撒更多
  document.getElementById('cardEmoji').textContent = emoji;
  document.getElementById('cardTitle').textContent = title;
  document.getElementById('cardText').textContent = text;
  const btn = document.getElementById('cardBtn');
  btn.textContent = btnLabel;
  overlayEl.classList.add('show');

  btn.onclick = () => {
    overlayEl.classList.remove('show');
    if (success) {
      if (levelIndex === -1) {
        // 自己造的关：留在原关，清空命令重玩
      } else if (isFinalWin) { levelIndex = 0; }
      else { levelIndex++; }
      program = [];
      renderProgram();
      buildBoard();
    } else {
      // 失败：保留程序，机器人回起点，方便修改
      buildBoard();
    }
  };
}

/* 撞击效果：机器人朝障碍方向冲一截再弹回，障碍格晃动并冒 💥 */
async function crash(dir, tx, ty) {
  const r = document.getElementById('robot');
  // 机器人朝障碍方向冲出约 40% 一格的距离
  const push = 0.4;
  const lungeX = dir.x * r.offsetWidth * push;
  const lungeY = dir.y * r.offsetHeight * push;
  r.style.transition = 'translate .12s ease-out';
  r.style.translate = `${lungeX}px ${lungeY}px`;
  await sleep(120);

  // 撞上的瞬间：💥 + 石头晃动 + 机器人受惊变大一下
  showBurst(tx, ty, dir);
  const rock = boardEl.querySelector(`.cell.wall[data-x="${tx}"][data-y="${ty}"]`);
  if (rock) { rock.classList.add('shake'); setTimeout(() => rock.classList.remove('shake'), 400); }
  r.classList.add('bump');

  // 弹回原位
  r.style.translate = '0 0';
  await sleep(380);
  r.classList.remove('bump');
  r.style.transition = '';
  r.style.translate = '';
}

/* 在格子(或地图边界)位置冒出一个 💥 */
function showBurst(tx, ty, dir) {
  const lv = level();
  // 若目标格在地图内就用该格，否则用机器人当前格作为撞击点
  const inMap = tx >= 0 && ty >= 0 && tx < lv.cols && ty < lv.rows;
  const cx = inMap ? tx : robot.x;
  const cy = inMap ? ty : robot.y;
  const cell = boardEl.querySelector(`.cell[data-x="${cx}"][data-y="${cy}"]`);
  if (!cell) return;
  const b = document.createElement('div');
  b.className = 'crash-burst';
  b.textContent = '💥';
  b.style.left = (cell.offsetLeft + cell.offsetWidth / 2 - 15) + 'px';
  b.style.top  = (cell.offsetTop  + cell.offsetHeight / 2 - 15) + 'px';
  boardEl.appendChild(b);
  setTimeout(() => b.remove(), 650);
}

/* 撒花特效：从屏幕顶部落下一堆彩色碎纸 */
function confetti(count) {
  const colors = ['#ff6b9d','#ffd86b','#5b8def','#4cc38a','#ff9f43','#b98bff','#ff5e5e'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 8 + Math.random() * 8;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px';
    p.style.height = (size * 0.6) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.4) + 's';
    p.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}
function cheer() {
  const r = document.getElementById('robot');
  r.classList.add('cheer');
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===== 音效（用浏览器自带的 Web Audio 合成，不需要音频文件）===== */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  // 手机/浏览器要求用户点击后才能出声，这里在需要时唤醒
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// 播放一个音符：频率 freq(Hz)、时长 dur(秒)、起始延迟 when(秒)、波形 type
function tone(freq, dur, when = 0, type = 'sine', vol = 0.22) {
  const ctx = getAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  // 用淡入淡出包络，避免"啪"的爆音
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
function soundStep()  { tone(660, 0.12, 0, 'triangle', 0.18); }              // 走一步：清脆"嘀"
function soundBump()  { tone(150, 0.28, 0, 'sawtooth', 0.25); }             // 撞墙：低沉"咚"
function soundWin()   {                                                     // 过关：一小段上行旋律
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, i * 0.13, 'triangle', 0.22));
}
function soundCheer() {                                                      // 通关：更长更欢快
  [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.26, i * 0.12, 'triangle', 0.22));
}

// 手机浏览器要求"用户点击后"才允许出声，第一次触摸时唤醒音频
function unlockAudio() {
  getAudio();
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('touchstart', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('touchstart', unlockAudio);

// 点方向键时给个轻轻的"咔"声，让孩子知道命令记下了
function addCommandWithSound(cmd) {
  addCommand(cmd);
  tone(880, 0.06, 0, 'square', 0.12);
}

/* 绑定按钮 */
document.getElementById('btnUp').onclick    = () => addCommandWithSound('up');
document.getElementById('btnDown').onclick  = () => addCommandWithSound('down');
document.getElementById('btnLeft').onclick  = () => addCommandWithSound('left');
document.getElementById('btnRight').onclick = () => addCommandWithSound('right');
document.getElementById('btnLoop').onclick    = addLoop;
document.getElementById('btnUndo').onclick    = undo;
document.getElementById('btnClear').onclick   = clearProgram;
document.getElementById('btnRun').onclick     = run;

// 循环块上的 − / ＋ 调次数（事件委托）
programEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.loop-btn');
  if (!btn) return;
  const i = parseInt(btn.dataset.i, 10);
  changeLoop(i, btn.dataset.act === 'inc' ? 1 : -1);
});
document.getElementById('levelToggle').onclick = openLevelPicker;
document.getElementById('levelClose').onclick  = closeLevelPicker;
// 点浮层空白处也能关闭
document.getElementById('levelOverlay').onclick = (e) => {
  if (e.target.id === 'levelOverlay') closeLevelPicker();
};

// 自由搭建相关按钮
document.getElementById('levelBuild').onclick   = startEditor;
document.getElementById('btnEditSize').onclick  = cycleEditSize;
document.getElementById('btnEditClear').onclick = clearEditor;
document.getElementById('btnEditBack').onclick  = exitEditor;
document.getElementById('btnEditPlay').onclick  = playCustom;
// 选画笔
document.getElementById('palette').addEventListener('click', (e) => {
  const b = e.target.closest('.brush');
  if (b) selectBrush(b.dataset.brush);
});
// 编辑模式下点格子作画
boardEl.addEventListener('click', (e) => {
  if (!editing) return;
  const cell = e.target.closest('.cell');
  if (!cell) return;
  editCellAt(parseInt(cell.dataset.x, 10), parseInt(cell.dataset.y, 10));
});

// 窗口尺寸变化时重新摆放机器人
window.addEventListener('resize', () => { if (robot) placeRobot(false); });

// 开始游戏
buildBoard();
renderProgram();
</script>
