<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小机器人去充电 · 编程启蒙游戏</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA：可装到手机桌面、离线可玩 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5b8def">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小机器人">
</head>
<body>
  <h1>🤖 小机器人去充电</h1>

  <div class="game-wrap">
    <div class="status-bar">
      <span id="levelLabel">第 <span class="level-name" id="levelNum">1</span> 关</span>
      <span class="hint" id="goalHint">帮机器人找到电池！</span>
      <button class="level-toggle" id="levelToggle">🗺 选关</button>
    </div>

    <div class="main">
      <div id="board"></div>

      <div class="panel">
        <div class="program" id="program"></div>

        <div class="controls">
          <button class="cmd btn-up"    id="btnUp"><span class="ico">⬆</span>上</button>
          <button class="cmd btn-down"  id="btnDown"><span class="ico">⬇</span>下</button>
          <button class="cmd btn-left"  id="btnLeft"><span class="ico">⬅</span>左</button>
          <button class="cmd btn-right" id="btnRight"><span class="ico">➡</span>右</button>
        </div>

        <div class="actions">
          <button class="act btn-loop"  id="btnLoop">🔁 重复</button>
          <button class="act btn-undo"  id="btnUndo">↩ 撤回</button>
          <button class="act btn-clear" id="btnClear">🗑 清空</button>
          <button class="act btn-run"   id="btnRun">▶ 出发！</button>
        </div>

        <!-- 自由搭建：调色板 + 按钮（平时隐藏） -->
        <div class="editor" id="editor">
          <div class="edit-hint">先点一个工具，再点格子来画 👇</div>
          <div class="palette" id="palette">
            <button class="brush current" data-brush="wall">🪨<span>障碍</span></button>
            <button class="brush" data-brush="star">⭐<span>宝贝</span></button>
            <button class="brush" data-brush="start">🤖<span>起点</span></button>
            <button class="brush" data-brush="goal">🔋<span>电池</span></button>
            <button class="brush" data-brush="erase">🧹<span>擦掉</span></button>
          </div>
          <div class="edit-actions">
            <button class="act btn-edit-size"  id="btnEditSize">📐 换大小</button>
            <button class="act btn-edit-clear" id="btnEditClear">🗑 清空</button>
            <button class="act btn-edit-back"  id="btnEditBack">← 返回</button>
            <button class="act btn-edit-play"  id="btnEditPlay">▶ 开始玩</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 选关浮层 -->
  <div class="overlay" id="levelOverlay">
    <div class="card level-card">
      <h2>选择关卡</h2>
      <div class="level-select" id="levelSelect"></div>
      <button class="level-build" id="levelBuild">🏗 自己造一关</button>
      <button class="level-close" id="levelClose">关闭</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="cardEmoji">🎉</div>
      <h2 id="cardTitle">太棒啦！</h2>
      <p id="cardText">机器人充上电了！</p>
      <button id="cardBtn">下一关 →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/levels.js"></script>
  <script src="js/state.js"></script>
  <script src="js/board.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/program.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
