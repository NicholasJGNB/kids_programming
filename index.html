<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小机器人去充电 · 编程启蒙游戏</title>
<style>
  :root {
    --bg: #f4f7ff;
    --panel: #ffffff;
    --primary: #5b8def;
    --primary-dark: #3f6fd1;
    --green: #4cc38a;
    --green-dark: #34a06f;
    --orange: #ff9f43;
    --pink: #ff6b9d;
    --ink: #2c3e66;
    --grid-line: #dfe6f5;
    --cell: #eef3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    user-select: none;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h1 {
    font-size: 26px;
    margin: 6px 0 2px;
    text-align: center;
  }
  .game-wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border-radius: 16px;
    padding: 10px 16px;
    box-shadow: 0 4px 14px rgba(91,141,239,.12);
    font-size: 17px;
    font-weight: bold;
  }
  .status-bar > span:first-child { white-space: nowrap; }
  .status-bar .level-name { color: var(--primary); }
  .status-bar .hint {
    font-weight: normal; font-size: 13px; color: #7a89ad;
    flex: 1; text-align: center; padding: 0 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 状态栏里的"选关"小按钮 */
  .level-toggle {
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    padding: 7px 12px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .level-toggle:active { translate: 0 3px; box-shadow: 0 0 0 var(--primary-dark); }

  /* 选关浮层里的网格 */
  .level-card { max-width: 340px; }
  .level-card h2 { margin: 2px 0 16px; font-size: 20px; color: var(--ink); }
  .level-select {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
  }
  .level-close {
    margin-top: 18px;
    border: none;
    background: #9aa6c4;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    padding: 11px 26px;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 4px 0 #7e8aa8;
  }
  .level-close:active { translate: 0 4px; box-shadow: 0 0 0 #7e8aa8; }
  .level-select .level-btn {
    width: 100%;          /* 填满网格列，永远不溢出卡片 */
    aspect-ratio: 1 / 1;  /* 保持正方形 */
    padding: 0;
    border: none;
    border-radius: 12px;
    background: #eef3ff;
    color: var(--primary);
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #d3def5;
    transition: translate .08s;
  }
  .level-select .level-btn:active { translate: 0 3px; box-shadow: 0 0 0 #d3def5; }
  .level-select .level-btn.current {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 0 var(--primary-dark);
  }
  .level-btn.done::after {
    content: "⭐";
    font-size: 11px;
    position: absolute;
    margin: -8px 0 0 2px;
  }
  .level-btn { position: relative; }

  /* 地图 */
  #board {
    background: var(--panel);
    border-radius: 18px;
    padding: 12px;
    box-shadow: 0 4px 18px rgba(91,141,239,.15);
    display: grid;
    gap: 4px;
    aspect-ratio: 1 / 1;
    width: 100%;
    position: relative; /* 机器人以地图为定位参照 */
  }
  .cell {
    background: var(--cell);
    border-radius: 10px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }
  .cell.wall {
    background: #c9d3ea;
    box-shadow: inset 0 -4px 0 #aab8d8;
  }
  .cell.goal { background: #fff4d6; }
  .cell.star { background: #fff9e6; }
  .star-burst {
    position: absolute;
    z-index: 7;
    font-size: 26px;
    pointer-events: none;
    animation: starfly .6s ease-out forwards;
  }
  @keyframes starfly {
    0%   { transform: scale(.6) translateY(0); opacity: 1; }
    100% { transform: scale(1.6) translateY(-30px); opacity: 0; }
  }
  .robot {
    position: absolute;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    transition: left .35s ease, top .35s ease, transform .35s ease;
    z-index: 5;
    will-change: left, top, transform;
  }
  .robot.bump { animation: bump .4s; }
  @keyframes bump {
    0%,100% { scale: 1; }
    30% { scale: 1.25; }
    60% { scale: .9; }
  }
  .robot.cheer { animation: cheer .6s infinite; }
  @keyframes cheer {
    0%,100% { translate: 0 0; }
    50% { translate: 0 -8px; }
  }
  /* 被撞的石头晃一晃 */
  .cell.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-4px) rotate(-6deg); }
    40% { transform: translateX(4px) rotate(6deg); }
    60% { transform: translateX(-3px) rotate(-4deg); }
    80% { transform: translateX(3px) rotate(4deg); }
  }
  /* 撞击冒出的 💥 */
  .crash-burst {
    position: absolute;
    z-index: 8;
    font-size: 30px;
    pointer-events: none;
    animation: burst .6s ease-out forwards;
  }
  @keyframes burst {
    0%   { transform: scale(.3); opacity: 0; }
    30%  { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* 程序条：固定单行，命令多了左右滑动查看 */
  .program {
    background: var(--panel);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 4px 14px rgba(91,141,239,.12);
    min-height: 58px;
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    align-items: center;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .program::-webkit-scrollbar { height: 5px; }
  .program::-webkit-scrollbar-thumb { background: #cfd9f0; border-radius: 3px; }
  .program .chip { flex: 0 0 auto; }
  .chip {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
    animation: pop .2s;
  }
  @keyframes pop { from { scale: .4; } to { scale: 1; } }
  .chip.cmd-up, .chip.cmd-down, .chip.cmd-left, .chip.cmd-right { background: var(--green); }
  .chip.running { outline: 4px solid #ffd86b; }

  /* 按钮区 */
  .controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
  }
  button.cmd {
    border: none;
    border-radius: 16px;
    padding: 16px 0;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: translate .08s;
    background: var(--green);
  }
  button.cmd:active { translate: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  button.cmd .ico { font-size: 28px; }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 10px;
  }
  button.act {
    border: none;
    border-radius: 16px;
    padding: 14px 0;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
    transition: translate .08s;
    color: #fff;
  }
  button.act:active { translate: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .btn-undo { background: #9aa6c4; }
  .btn-clear { background: var(--pink); }
  .btn-run { background: var(--primary); }
  button:disabled { opacity: .5; cursor: default; }

  /* 庆祝弹窗 */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(44,62,102,.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 28px 26px;
    text-align: center;
    max-width: 320px;
    width: 86%;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    animation: pop .3s;
  }
  .card .emoji { font-size: 56px; }
  .card h2 { margin: 8px 0; font-size: 24px; color: var(--green-dark); }
  .card p { color: #7a89ad; font-size: 15px; margin: 6px 0 18px; }
  .card button {
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 30px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--primary-dark);
  }
  .card button:active { translate: 0 4px; box-shadow: 0 1px 0 var(--primary-dark); }
  /* 过关撒花 */
  .confetti-piece {
    position: fixed;
    top: -24px;
    z-index: 60;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(900deg); opacity: 1; }
  }
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    translate: -50% 0;
    background: var(--ink);
    color: #fff;
    padding: 12px 22px;
    border-radius: 14px;
    font-size: 16px;
    z-index: 60;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
  <h1>🤖 小机器人去充电</h1>

  <div class="game-wrap">
    <div class="status-bar">
      <span>第 <span class="level-name" id="levelNum">1</span> 关</span>
      <span class="hint" id="goalHint">帮机器人找到电池！</span>
      <button class="level-toggle" id="levelToggle">🗺 选关</button>
    </div>

    <div id="board"></div>

    <div class="program" id="program"></div>

    <div class="controls">
      <button class="cmd btn-up"    id="btnUp"><span class="ico">⬆</span>上</button>
      <button class="cmd btn-down"  id="btnDown"><span class="ico">⬇</span>下</button>
      <button class="cmd btn-left"  id="btnLeft"><span class="ico">⬅</span>左</button>
      <button class="cmd btn-right" id="btnRight"><span class="ico">➡</span>右</button>
    </div>

    <div class="actions">
      <button class="act btn-undo"  id="btnUndo">↩ 撤回</button>
      <button class="act btn-clear" id="btnClear">🗑 清空</button>
      <button class="act btn-run"   id="btnRun">▶ 出发！</button>
    </div>
  </div>

  <!-- 选关浮层 -->
  <div class="overlay" id="levelOverlay">
    <div class="card level-card">
      <h2>选择关卡</h2>
      <div class="level-select" id="levelSelect"></div>
      <button class="level-close" id="levelClose">关闭</button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="emoji" id="cardEmoji">🎉</div>
      <h2 id="cardTitle">太棒啦！</h2>
      <p id="cardText">机器人充上电了！</p>
      <button id="cardBtn">下一关 →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== 关卡数据 =====
   每一关是一张方格地图。
   start 起点 / goal 电池终点 / walls 石头(走不进) / stars 路上要收集的⭐(可选)
   有 stars 的关卡，必须把所有⭐都捡完、再走到🔋才算过关。
*/
const LEVELS = [
  // —— 第一组：认识走路（无障碍）——
  { // 1 往右直直走
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:3,y:3}, walls: [],
    hint: "一直往右走，找到电池！"
  },
  { // 2 往上走
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:0,y:0}, walls: [],
    hint: "一直往上走就到啦！"
  },
  { // 3 拐一个弯
    cols: 4, rows: 4, start: {x:0,y:3}, goal: {x:3,y:0}, walls: [],
    hint: "先往右，再往上走！"
  },
  { // 4 路上捡一颗星星
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4}, walls: [],
    stars: [ {x:2,y:4} ],
    hint: "路上有颗⭐，记得捡走它！"
  },

  // —— 第二组：开始有石头 ——
  { // 5 绕开一块石头
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4}, walls: [ {x:2,y:4} ],
    hint: "当心石头，要绕过去！"
  },
  { // 6 走 L 形
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:0},
    walls: [ {x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3} ],
    hint: "先一直往上，再往右走！"
  },
  { // 7 边走边捡两颗星
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:0}, walls: [],
    stars: [ {x:2,y:4},{x:2,y:0} ],
    hint: "把两颗⭐都捡到，再去充电！"
  },
  { // 8 门洞：中间留一个口
    cols: 5, rows: 5, start: {x:0,y:4}, goal: {x:4,y:4},
    walls: [ {x:2,y:4},{x:2,y:3},{x:2,y:1},{x:2,y:0} ],
    hint: "墙上有个洞，从中间钻过去！"
  },

  // —— 第三组：S 形与小迷宫 ——
  { // 9 S 形迷宫
    cols: 6, rows: 6, start: {x:0,y:5}, goal: {x:5,y:0},
    walls: [
      {x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},
      {x:3,y:1},{x:3,y:2},{x:3,y:3},{x:3,y:4},{x:3,y:5}
    ],
    hint: "弯弯绕绕，慢慢想，你一定行！"
  },
  { // 10 绕圈捡星
    cols: 6, rows: 6, start: {x:0,y:5}, goal: {x:0,y:0},
    walls: [ {x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:2,y:1},{x:3,y:1},{x:4,y:1} ],
    stars: [ {x:5,y:5},{x:5,y:0} ],
    hint: "先去右边捡两颗⭐，再绕回来！"
  },
  { // 11 梳子形
    cols: 6, rows: 6, start: {x:0,y:5}, goal: {x:5,y:5},
    walls: [
      {x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3},
      {x:3,y:2},{x:3,y:3},{x:3,y:4},{x:3,y:5}
    ],
    hint: "上上下下绕过两排栅栏！"
  },
  { // 12 三颗星星
    cols: 6, rows: 6, start: {x:0,y:5}, goal: {x:5,y:0},
    walls: [ {x:2,y:5},{x:2,y:4},{x:2,y:3},{x:4,y:0},{x:4,y:1},{x:4,y:2} ],
    stars: [ {x:1,y:0},{x:3,y:5},{x:5,y:5} ],
    hint: "三颗⭐都要捡到哦，动动脑筋！"
  },

  // —— 第四组：大迷宫挑战（7x7）——
  { // 13 走进中心的小屋（底部留门）
    cols: 7, rows: 7, start: {x:0,y:6}, goal: {x:3,y:3},
    walls: [
      {x:1,y:1},{x:2,y:1},{x:3,y:1},{x:4,y:1},{x:5,y:1},
      {x:1,y:2},{x:5,y:2},{x:1,y:3},{x:5,y:3},{x:1,y:4},{x:5,y:4},
      {x:1,y:5},{x:2,y:5},{x:4,y:5},{x:5,y:5}
    ],
    hint: "小屋只有一个门，从下面钻进去！"
  },
  { // 14 迷宫A
    cols: 7, rows: 7, start: {x:0,y:6}, goal: {x:6,y:0},
    walls: [
      {x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},
      {x:3,y:2},{x:3,y:3},{x:3,y:4},{x:3,y:5},{x:3,y:6},
      {x:5,y:0},{x:5,y:1},{x:5,y:2},{x:5,y:3},{x:5,y:4}
    ],
    hint: "三道栅栏，找到缝隙穿过去！"
  },
  { // 15 迷宫B + 两颗星
    cols: 7, rows: 7, start: {x:0,y:6}, goal: {x:6,y:6},
    walls: [
      {x:2,y:6},{x:2,y:5},{x:2,y:4},{x:2,y:3},
      {x:4,y:1},{x:4,y:2},{x:4,y:3},
      {x:5,y:3},{x:6,y:3}
    ],
    stars: [ {x:0,y:0},{x:6,y:0} ],
    hint: "上去捡两颗⭐，再下来充电！"
  },
  { // 16 迷宫C
    cols: 7, rows: 7, start: {x:0,y:0}, goal: {x:6,y:6},
    walls: [
      {x:1,y:1},{x:2,y:1},{x:3,y:1},{x:4,y:1},{x:5,y:1},
      {x:5,y:2},{x:5,y:3},{x:5,y:4},
      {x:1,y:3},{x:1,y:4},{x:1,y:5},{x:2,y:5},{x:3,y:5}
    ],
    hint: "从左上到右下，绕过弯弯的墙！"
  },

  // —— 终极挑战（8x8）——
  { // 17 大迷宫
    cols: 8, rows: 8, start: {x:0,y:7}, goal: {x:7,y:0},
    walls: [
      {x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:1,y:5},{x:1,y:6},
      {x:3,y:0},{x:3,y:1},{x:3,y:2},{x:3,y:3},{x:3,y:4},{x:3,y:5},
      {x:5,y:2},{x:5,y:3},{x:5,y:4},{x:5,y:5},{x:5,y:6},{x:5,y:7},
      {x:7,y:2},{x:7,y:3},{x:7,y:4}
    ],
    hint: "好大的迷宫！别着急，一步一步来。"
  },
  { // 18 终极：大迷宫 + 三颗星
    cols: 8, rows: 8, start: {x:0,y:7}, goal: {x:7,y:7},
    walls: [
      {x:1,y:0},{x:1,y:1},{x:1,y:2},{x:1,y:3},{x:1,y:4},{x:1,y:5},
      {x:3,y:2},{x:3,y:3},{x:3,y:4},{x:3,y:5},{x:3,y:6},{x:3,y:7},
      {x:5,y:1},{x:5,y:2},{x:5,y:3},{x:5,y:4},{x:5,y:5},
      {x:6,y:5},{x:7,y:5}
    ],
    stars: [ {x:0,y:0},{x:4,y:0},{x:7,y:0} ],
    hint: "最后一关！捡齐三颗⭐再去充电，你就是编程小高手！"
  }
];

// 四个方向各走一格
const MOVE_DELTA = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1,  y: 0 }
};
const ARROW = { up: '⬆', down: '⬇', left: '⬅', right: '➡' };

let levelIndex = 0;
let program = [];        // 当前命令序列，例如 ['right','up',...]
let robot = null;        // {x, y, dir}
let isRunning = false;
let cleared = new Set(); // 已通关的关卡序号（用来显示 ⭐）
let starsLeft = new Set(); // 本关还没捡到的星星

const boardEl   = document.getElementById('board');
const programEl = document.getElementById('program');
const overlayEl = document.getElementById('overlay');
const toastEl   = document.getElementById('toast');

function level() { return LEVELS[levelIndex]; }

/* 渲染地图与机器人初始位置 */
function buildBoard() {
  const lv = level();
  boardEl.style.gridTemplateColumns = `repeat(${lv.cols}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${lv.rows}, 1fr)`;
  boardEl.innerHTML = '';

  for (let y = 0; y < lv.rows; y++) {
    for (let x = 0; x < lv.cols; x++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.x = x;
      cell.dataset.y = y;
      if (lv.walls.some(w => w.x === x && w.y === y)) {
        cell.classList.add('wall');
        cell.textContent = '🪨';
      }
      if (lv.goal.x === x && lv.goal.y === y) {
        cell.classList.add('goal');
        cell.textContent = '🔋';
      }
      if ((lv.stars || []).some(s => s.x === x && s.y === y)) {
        cell.classList.add('star');
        cell.dataset.star = '1';
        cell.textContent = '⭐';
      }
      boardEl.appendChild(cell);
    }
  }

  // 这一关还没捡到的星星（坐标字符串集合）
  starsLeft = new Set((lv.stars || []).map(s => s.x + ',' + s.y));

  // 机器人
  robot = { x: lv.start.x, y: lv.start.y };
  const r = document.createElement('div');
  r.className = 'robot';
  r.id = 'robot';
  r.textContent = '🤖';
  boardEl.appendChild(r);
  placeRobot(false);

  document.getElementById('levelNum').textContent = levelIndex + 1;
  document.getElementById('goalHint').textContent = lv.hint;
  renderLevelSelect();
}

/* 选关：一排可点的关卡按钮，全部可选，当前关高亮，通关的带 ⭐ */
function renderLevelSelect() {
  const box = document.getElementById('levelSelect');
  box.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'level-btn';
    if (i === levelIndex) btn.classList.add('current');
    if (cleared.has(i)) btn.classList.add('done');
    btn.textContent = (i + 1);
    btn.onclick = () => goToLevel(i);
    box.appendChild(btn);
  }
}

/* 跳到指定关卡 */
function goToLevel(i) {
  if (isRunning) return;          // 运行中不许切关
  closeLevelPicker();
  if (i === levelIndex) return;   // 已经在这关
  levelIndex = i;
  program = [];
  renderProgram();
  buildBoard();
}

/* 打开 / 关闭选关浮层 */
function openLevelPicker() {
  if (isRunning) return;
  renderLevelSelect();
  document.getElementById('levelOverlay').classList.add('show');
}
function closeLevelPicker() {
  document.getElementById('levelOverlay').classList.remove('show');
}

/* 机器人当前格子若有星星，就把它收集掉 */
function collectStarHere() {
  const key = robot.x + ',' + robot.y;
  if (!starsLeft.has(key)) return;
  starsLeft.delete(key);
  const cell = boardEl.querySelector(`.cell[data-star][data-x="${robot.x}"][data-y="${robot.y}"]`);
  if (cell) {
    cell.classList.remove('star');
    cell.removeAttribute('data-star');
    cell.textContent = '';
  }
  // 飞出一颗⭐的小动画 + 叮的一声
  starBurst(robot.x, robot.y);
  tone(1318, 0.12, 0, 'triangle', 0.2);
  tone(1760, 0.12, 0.06, 'triangle', 0.18);
}

/* 收集星星时冒出的小动画 */
function starBurst(x, y) {
  const cell = boardEl.querySelector(`.cell[data-x="${x}"][data-y="${y}"]`);
  if (!cell) return;
  const s = document.createElement('div');
  s.className = 'star-burst';
  s.textContent = '⭐';
  s.style.left = (cell.offsetLeft + cell.offsetWidth / 2 - 14) + 'px';
  s.style.top  = (cell.offsetTop + cell.offsetHeight / 2 - 14) + 'px';
  boardEl.appendChild(s);
  setTimeout(() => s.remove(), 600);
}

/* 把机器人div对齐到目标格子的真实位置（自动算准间距和留白） */
function placeRobot(animate) {
  const r = document.getElementById('robot');
  const cell = boardEl.querySelector(`.cell[data-x="${robot.x}"][data-y="${robot.y}"]`);
  if (!cell) return;
  if (!animate) r.style.transition = 'none';
  // offsetLeft/Top 是相对于 #board（已设为 position:relative）的精确像素位置
  r.style.left   = cell.offsetLeft + 'px';
  r.style.top    = cell.offsetTop + 'px';
  r.style.width  = cell.offsetWidth + 'px';
  r.style.height = cell.offsetHeight + 'px';
  if (!animate) {
    // 强制重绘后恢复动画
    void r.offsetWidth;
    r.style.transition = '';
  }
}

/* 渲染程序条 */
function renderProgram() {
  programEl.innerHTML = '';
  if (program.length === 0) return;
  program.forEach((cmd, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip cmd-' + cmd;
    chip.dataset.index = i;
    chip.textContent = ARROW[cmd];
    programEl.appendChild(chip);
  });
  // 命令多时自动滑到最右，露出刚加的命令
  programEl.scrollLeft = programEl.scrollWidth;
}

function addCommand(cmd) {
  if (isRunning) return;
  if (program.length >= 60) { toast('命令有点太多啦～'); return; }
  program.push(cmd);
  renderProgram();
}

function undo() {
  if (isRunning) return;
  program.pop();
  renderProgram();
}

function clearProgram() {
  if (isRunning) return;
  program = [];
  renderProgram();
  buildBoard(); // 机器人回到起点
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll('button').forEach(b => {
    if (b.id !== 'cardBtn') b.disabled = disabled;
  });
}

/* 运行程序：一步步执行 */
async function run() {
  if (isRunning || program.length === 0) {
    if (program.length === 0) toast('先给机器人下几个命令吧～');
    return;
  }
  isRunning = true;
  setButtonsDisabled(true);
  // 重建地图：机器人回起点、星星重新出现
  buildBoard();
  const lv = level();
  await sleep(300);

  const chips = programEl.querySelectorAll('.chip');

  for (let i = 0; i < program.length; i++) {
    chips.forEach(c => c.classList.remove('running'));
    if (chips[i]) {
      chips[i].classList.add('running');
      // 只在命令条内部横向滚动，让当前命令居中可见（不动整个页面）
      programEl.scrollLeft = chips[i].offsetLeft - programEl.clientWidth / 2 + chips[i].offsetWidth / 2;
    }
    const cmd = program[i];

    const d = MOVE_DELTA[cmd];
    const nx = robot.x + d.x;
    const ny = robot.y + d.y;
    if (!canMoveTo(nx, ny)) {
      // 撞墙或出界：朝障碍方向冲一下、撞击、再弹回
      soundBump();
      await crash(d, nx, ny);
      const hitRock = level().walls.some(w => w.x === nx && w.y === ny);
      finishRun(false,
        hitRock ? '咣！撞到石头啦！' : '哎呀，撞墙啦！',
        hitRock ? '前面有块大石头 🪨，机器人过不去，要绕开它哦～' : '机器人不能走出地图，再想想怎么走～',
        '😵', '再试一次');
      return;
    }
    robot.x = nx;
    robot.y = ny;
    placeRobot(true);
    soundStep();
    await sleep(450);

    // 踩到星星就收集
    collectStarHere();

    // 到达终点：必须把星星都捡完才算过关
    if (robot.x === lv.goal.x && robot.y === lv.goal.y) {
      if (starsLeft.size > 0) {
        chips.forEach(c => c.classList.remove('running'));
        await sleep(200);
        finishRun(false, '还差星星！',
          `还有 ${starsLeft.size} 颗⭐没捡到呢，先把⭐都收集齐再来充电～`,
          '🤔', '再试一次');
        return;
      }
      chips.forEach(c => c.classList.remove('running'));
      cleared.add(levelIndex);  // 记下这一关已通关，显示 ⭐
      cheer();
      const isLast = levelIndex === LEVELS.length - 1;
      if (isLast) soundCheer(); else soundWin();
      await sleep(700);
      finishRun(true,
        isLast ? '全部通关啦！🏆' : '太棒啦！',
        isLast ? '你是真正的小小程序员！可以从头再玩，或挑战实体机器人～' : '机器人充上电了！',
        isLast ? '🏆' : '🎉',
        isLast ? '再玩一次' : '下一关 →',
        isLast);
      return;
    }
  }

  // 程序走完但没到终点
  chips.forEach(c => c.classList.remove('running'));
  await sleep(200);
  finishRun(false, '差一点点！', '机器人还没走到电池那里，再加几个命令试试～', '🤔', '再试一次');
}

function canMoveTo(x, y) {
  const lv = level();
  if (x < 0 || y < 0 || x >= lv.cols || y >= lv.rows) return false;
  if (lv.walls.some(w => w.x === x && w.y === y)) return false;
  return true;
}

function finishRun(success, title, text, emoji, btnLabel, isFinalWin) {
  isRunning = false;
  setButtonsDisabled(false);
  if (success) confetti(isFinalWin ? 160 : 90); // 过关撒花，通关撒更多
  document.getElementById('cardEmoji').textContent = emoji;
  document.getElementById('cardTitle').textContent = title;
  document.getElementById('cardText').textContent = text;
  const btn = document.getElementById('cardBtn');
  btn.textContent = btnLabel;
  overlayEl.classList.add('show');

  btn.onclick = () => {
    overlayEl.classList.remove('show');
    if (success) {
      if (isFinalWin) { levelIndex = 0; }
      else { levelIndex++; }
      program = [];
      renderProgram();
      buildBoard();
    } else {
      // 失败：保留程序，机器人回起点，方便修改
      buildBoard();
    }
  };
}

/* 撞击效果：机器人朝障碍方向冲一截再弹回，障碍格晃动并冒 💥 */
async function crash(dir, tx, ty) {
  const r = document.getElementById('robot');
  // 机器人朝障碍方向冲出约 40% 一格的距离
  const push = 0.4;
  const lungeX = dir.x * r.offsetWidth * push;
  const lungeY = dir.y * r.offsetHeight * push;
  r.style.transition = 'translate .12s ease-out';
  r.style.translate = `${lungeX}px ${lungeY}px`;
  await sleep(120);

  // 撞上的瞬间：💥 + 石头晃动 + 机器人受惊变大一下
  showBurst(tx, ty, dir);
  const rock = boardEl.querySelector(`.cell.wall[data-x="${tx}"][data-y="${ty}"]`);
  if (rock) { rock.classList.add('shake'); setTimeout(() => rock.classList.remove('shake'), 400); }
  r.classList.add('bump');

  // 弹回原位
  r.style.translate = '0 0';
  await sleep(380);
  r.classList.remove('bump');
  r.style.transition = '';
  r.style.translate = '';
}

/* 在格子(或地图边界)位置冒出一个 💥 */
function showBurst(tx, ty, dir) {
  const lv = level();
  // 若目标格在地图内就用该格，否则用机器人当前格作为撞击点
  const inMap = tx >= 0 && ty >= 0 && tx < lv.cols && ty < lv.rows;
  const cx = inMap ? tx : robot.x;
  const cy = inMap ? ty : robot.y;
  const cell = boardEl.querySelector(`.cell[data-x="${cx}"][data-y="${cy}"]`);
  if (!cell) return;
  const b = document.createElement('div');
  b.className = 'crash-burst';
  b.textContent = '💥';
  b.style.left = (cell.offsetLeft + cell.offsetWidth / 2 - 15) + 'px';
  b.style.top  = (cell.offsetTop  + cell.offsetHeight / 2 - 15) + 'px';
  boardEl.appendChild(b);
  setTimeout(() => b.remove(), 650);
}

/* 撒花特效：从屏幕顶部落下一堆彩色碎纸 */
function confetti(count) {
  const colors = ['#ff6b9d','#ffd86b','#5b8def','#4cc38a','#ff9f43','#b98bff','#ff5e5e'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    const size = 8 + Math.random() * 8;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px';
    p.style.height = (size * 0.6) + 'px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.4) + 's';
    p.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}
function cheer() {
  const r = document.getElementById('robot');
  r.classList.add('cheer');
}

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ===== 音效（用浏览器自带的 Web Audio 合成，不需要音频文件）===== */
let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  // 手机/浏览器要求用户点击后才能出声，这里在需要时唤醒
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// 播放一个音符：频率 freq(Hz)、时长 dur(秒)、起始延迟 when(秒)、波形 type
function tone(freq, dur, when = 0, type = 'sine', vol = 0.22) {
  const ctx = getAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  // 用淡入淡出包络，避免"啪"的爆音
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}
function soundStep()  { tone(660, 0.12, 0, 'triangle', 0.18); }              // 走一步：清脆"嘀"
function soundBump()  { tone(150, 0.28, 0, 'sawtooth', 0.25); }             // 撞墙：低沉"咚"
function soundWin()   {                                                     // 过关：一小段上行旋律
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, i * 0.13, 'triangle', 0.22));
}
function soundCheer() {                                                      // 通关：更长更欢快
  [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.26, i * 0.12, 'triangle', 0.22));
}

// 手机浏览器要求"用户点击后"才允许出声，第一次触摸时唤醒音频
function unlockAudio() {
  getAudio();
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('touchstart', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('touchstart', unlockAudio);

// 点方向键时给个轻轻的"咔"声，让孩子知道命令记下了
function addCommandWithSound(cmd) {
  addCommand(cmd);
  tone(880, 0.06, 0, 'square', 0.12);
}

/* 绑定按钮 */
document.getElementById('btnUp').onclick    = () => addCommandWithSound('up');
document.getElementById('btnDown').onclick  = () => addCommandWithSound('down');
document.getElementById('btnLeft').onclick  = () => addCommandWithSound('left');
document.getElementById('btnRight').onclick = () => addCommandWithSound('right');
document.getElementById('btnUndo').onclick    = undo;
document.getElementById('btnClear').onclick   = clearProgram;
document.getElementById('btnRun').onclick     = run;
document.getElementById('levelToggle').onclick = openLevelPicker;
document.getElementById('levelClose').onclick  = closeLevelPicker;
// 点浮层空白处也能关闭
document.getElementById('levelOverlay').onclick = (e) => {
  if (e.target.id === 'levelOverlay') closeLevelPicker();
};

// 窗口尺寸变化时重新摆放机器人
window.addEventListener('resize', () => placeRobot(false));

// 开始游戏
buildBoard();
renderProgram();
</script>
