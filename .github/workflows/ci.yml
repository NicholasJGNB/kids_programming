name: CI

# 每次推送或 PR 都自动跑：关卡可解性、循环逻辑、端到端冒烟测试
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 单元测试（关卡可解性 + 循环逻辑）
        run: npm test

      - name: 关卡难度评估（顺带再次校验可解性）
        run: npm run eval

      - name: 安装 Playwright 浏览器
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: 端到端冒烟测试
        run: npm run test:e2e
